<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashtree</title>
<style>
  /* soft mint by default; deep teal-grey when the system prefers dark */
  :root {
    color-scheme: light;
    --bg:#dff0ec; --bg-glow:#f0faf7; --card:#ffffff; --card-hollow:rgba(255,255,255,.5); --surface-2:#ffffff;
    --text:#121a1f; --muted:#5a6a72; --line:#8fa8a0; --border-strong:#5f7d75;
    --accent:#1f9d84; --focus:#0f7f6a; --star:#e0a100;
    --tile-s:80%; --tile-l:88%; --tile-ink-l:28%;
    --select-fill:rgba(31,157,132,.14);
    --shadow:0 10px 28px rgba(31,80,70,.12); --shadow-lg:0 14px 40px rgba(31,80,70,.2);
  }
  /* dark: when the system prefers it (unless light is forced), or when dark is chosen explicitly */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#0e1816; --bg-glow:#16302a; --card:#17231f; --card-hollow:rgba(23,35,31,.5); --surface-2:#1c2a26;
      --text:#e8f1ee; --muted:#9db3ac; --line:#4f6e66; --border-strong:#7fa398;
      --accent:#3ccfae; --focus:#7fe6cd; --star:#f5c542;
      --tile-s:35%; --tile-l:26%; --tile-ink-l:82%;
      --select-fill:rgba(60,207,174,.16);
      --shadow:0 10px 28px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0e1816; --bg-glow:#16302a; --card:#17231f; --card-hollow:rgba(23,35,31,.5); --surface-2:#1c2a26;
    --text:#e8f1ee; --muted:#9db3ac; --line:#4f6e66; --border-strong:#7fa398;
    --accent:#3ccfae; --focus:#7fe6cd; --star:#f5c542;
    --tile-s:35%; --tile-l:26%; --tile-ink-l:82%;
    --select-fill:rgba(60,207,174,.16);
    --shadow:0 10px 28px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font:14px/1.45 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; color:var(--text); overflow:hidden;
         background:radial-gradient(1100px 520px at 18% -8%, var(--bg-glow), transparent 70%), var(--bg); }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

  #topbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px 14px; padding:22px 36px 6px; flex:none; }
  #topbar h1 { font-size:24px; font-weight:700; letter-spacing:-.01em; margin:0 10px 0 0; }
  #topbar .spacer { flex:1; }
  #topbar input[type=search] { width:min(300px,100%); min-height:40px; background:var(--card); color:var(--text); border:0; border-radius:999px; padding:8px 18px; font-size:14px; box-shadow:var(--shadow); }
  #topbar input[type=search]::placeholder { color:var(--muted); }
  #topbar button { min-height:40px; background:var(--card); border:0; border-radius:999px; padding:8px 18px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); }
  #topbar button:hover { color:var(--accent); }
  #topbar .theme-toggle { width:40px; padding:0; display:flex; align-items:center; justify-content:center; }
  .theme-toggle svg { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .theme-toggle[aria-checked="true"] .moon, .theme-toggle:not([aria-checked="true"]) .sun { display:none; }

  #viewport { flex:1; overflow:auto; padding:48px 56px 90px; position:relative; cursor:grab; user-select:none; }
  #viewport.panning { cursor:grabbing; }
  #canvas { position:relative; min-width:100%; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); text-align:center; padding:0 20px; pointer-events:none; }
  #empty strong { color:var(--text); font-size:18px; }
  #empty[hidden] { display:none; }

  .connectors { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
  .connectors .link { fill:none; stroke:var(--line); stroke-width:1.75; stroke-dasharray:5 5; }
  .connectors .link.open { stroke:var(--accent); }
  .connectors .dot.open { fill:var(--accent); stroke:var(--accent); stroke-width:2; }
  .connectors .dot.hollow { fill:var(--bg); stroke:var(--border-strong); stroke-width:2; }

  .node { position:absolute; display:flex; align-items:stretch; border-radius:20px; background:var(--card); box-shadow:var(--shadow); overflow:hidden; white-space:nowrap; }
  .node.hollow { background:var(--card-hollow); box-shadow:none; outline:1.5px dashed var(--border-strong); outline-offset:-1.5px; }
  .node:hover { box-shadow:var(--shadow-lg); }
  .node.selected { outline:3px solid var(--accent); outline-offset:2px; }
  .node.match { outline:2px solid var(--accent); outline-offset:1px; }
  .node.dim { opacity:.35; }
  .node-main { flex:1; min-width:0; display:flex; align-items:center; gap:12px; padding:0 4px 0 12px; background:none; border:0; text-align:left; cursor:pointer; }
  .node-main:focus-visible, .star:focus-visible { outline-offset:-4px; border-radius:16px; }
  .tile { flex:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:hsl(var(--h) var(--tile-s) var(--tile-l)); }
  .node.hollow .tile { opacity:.8; }
  .tile .ico { width:22px; height:22px; }
  .tile .ico-fallback { font-weight:700; font-size:16px; color:hsl(var(--h) 45% var(--tile-ink-l)); }
  .words { flex:1; min-width:0; display:flex; flex-direction:column; }
  .label { font-weight:650; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  .node.hollow .label { color:var(--muted); }
  .note-mark { display:flex; color:var(--muted); }
  .star { flex:none; width:42px; display:flex; align-items:center; justify-content:center; background:none; border:0; color:var(--muted); cursor:pointer; }
  .star:hover { color:var(--star); }
  .star svg, .note-mark svg { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round; }
  .node.favourite .star { color:var(--star); }
  .node.favourite .star svg { fill:currentColor; }

  /* appearance settings: classes set on the canvas */
  .solid-lines .connectors .link { stroke-dasharray:none; }
  .hide-dots .connectors .dot { display:none; }
  .hide-site .sub { display:none; }
  .compact .node { border-radius:14px; }
  .compact .node-main { gap:9px; padding-left:9px; }
  .compact .tile { width:28px; height:28px; border-radius:9px; }
  .compact .tile .ico { width:16px; height:16px; }
  .compact .tile .ico-fallback { font-size:13px; }
  .compact .label { font-size:13px; }
  .compact .star { width:34px; }
  .compact .group-box { border-radius:20px; }

  .group-box { position:absolute; border:2px solid; border-radius:28px; pointer-events:none; opacity:.9; }
  .group-label { position:absolute; top:-10px; left:16px; max-width:calc(100% - 32px); overflow:hidden; text-overflow:ellipsis; padding:0 9px; border-radius:8px; font-size:11px; line-height:17px; color:#10211d; font-weight:700; white-space:nowrap; }
  .selection-box { position:absolute; border:1.5px solid var(--accent); border-radius:6px; background:var(--select-fill); pointer-events:none; }

  .menu { position:fixed; z-index:10; min-width:210px; background:var(--card); border-radius:16px; padding:6px; box-shadow:var(--shadow-lg); }
  .menu button { display:block; width:100%; min-height:36px; text-align:left; background:none; border:0; padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer; }
  .menu button:hover, .menu button:focus-visible { background:var(--bg); }
  .menu hr { border:0; border-top:1px solid var(--line); opacity:.5; margin:6px 4px; }
  .popover { position:absolute; right:36px; top:76px; z-index:10; max-width:min(440px,calc(100vw - 40px)); background:var(--card); border-radius:18px; padding:16px 18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-lg); }
  .popover label { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .popover { max-height:calc(100vh - 100px); overflow-y:auto; width:min(440px,calc(100vw - 40px)); }
  .popover h2 { margin:6px 0 0; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .popover h2:first-child { margin-top:0; }
  .popover input { accent-color:var(--accent); margin-top:3px; }
  .popover .field { align-items:center; justify-content:space-between; }
  .popover .field.stacked { flex-direction:column; align-items:stretch; gap:6px; }
  .popover select, .popover textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .popover textarea { width:100%; resize:vertical; min-height:84px; }
  .popover[hidden] { display:none; }

  @media (prefers-reduced-motion: no-preference) {
    .node { transition:box-shadow .15s ease, opacity .15s ease; }
    .star, #topbar button { transition:color .15s ease; }
  }
</style>
</head>
<body>
<header id="topbar"><h1>Dashtree</h1></header>
<main id="viewport" aria-label="Tab tree">
  <div id="empty" hidden><strong>Nothing recorded yet</strong><span>Browse a few pages and they will appear here as a tree.</span></div>
  <div id="canvas"></div>
</main>
<script type="module" src="page.js"></script>
</body>
</html>
