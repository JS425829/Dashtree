<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashtree</title>
<style>
  /* semantic tokens: dark by default, light when the system asks for it */
  :root {
    color-scheme: dark light;
    --bg:#16171b; --surface:#2a2d35; --surface-2:#22242a; --border:#6b7385; --border-strong:#8a93a6;
    --text:#e8e9ec; --muted:#a4abb8; --accent:#5aaeff; --focus:#8ec5ff; --star:#f5c542;
    --select-fill:rgba(90,174,255,.16); --shadow:0 6px 20px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f7f9; --surface:#ffffff; --surface-2:#eceef2; --border:#7a8394; --border-strong:#59627a;
      --text:#1b1d22; --muted:#4d5565; --accent:#0b63c5; --focus:#0b63c5; --star:#b7791f;
      --select-fill:rgba(11,99,197,.12); --shadow:0 6px 20px rgba(0,0,0,.18);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font:14px/1.45 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  #topbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 20px; border-bottom:1px solid var(--border); flex:none; }
  #topbar h1 { font-size:16px; margin:0; letter-spacing:.02em; }
  #topbar .spacer { flex:1; }
  #topbar input[type=search] { width:min(260px,100%); min-height:32px; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:13px; }
  #topbar input[type=search]::placeholder { color:var(--muted); }
  #topbar button { min-height:32px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  #topbar button:hover { border-color:var(--border-strong); }

  #viewport { flex:1; overflow:auto; padding:32px 40px 60px; position:relative; cursor:grab; user-select:none; }
  #viewport.panning { cursor:grabbing; }
  #canvas { position:relative; min-width:100%; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--muted); text-align:center; padding:0 20px; pointer-events:none; }
  #empty strong { color:var(--text); font-size:16px; }
  #empty[hidden] { display:none; }

  .connectors { position:absolute; left:0; top:0; pointer-events:none; }
  .connectors path { fill:none; stroke:var(--border); stroke-width:1; }

  .node { position:absolute; display:flex; align-items:stretch; border-radius:8px; background:var(--surface); border:1px solid var(--border); overflow:hidden; white-space:nowrap; }
  .node.hollow { background:transparent; border:1.5px dashed var(--border-strong); color:var(--muted); }
  .node:hover { border-color:var(--accent); }
  .node.selected { outline:2px solid var(--accent); outline-offset:1px; }
  .node.match { border-color:var(--accent); }
  .node.dim { opacity:.35; }
  .node-main { flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:0 4px 0 10px; background:none; border:0; text-align:left; cursor:pointer; }
  .node-main:focus-visible, .star:focus-visible { outline-offset:-3px; border-radius:6px; }
  .node .label { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .node .ico { width:16px; height:16px; flex:none; }
  .node .ico-fallback { width:16px; height:16px; flex:none; border-radius:4px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); font-size:10px; display:flex; align-items:center; justify-content:center; }
  .node .note-mark { display:flex; color:var(--muted); }
  .star { flex:none; width:32px; display:flex; align-items:center; justify-content:center; background:none; border:0; color:var(--muted); cursor:pointer; }
  .star:hover { color:var(--star); }
  .star svg, .note-mark svg { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round; }
  .node.favourite .star { color:var(--star); }
  .node.favourite .star svg { fill:currentColor; }

  .group-box { position:absolute; border:2px solid; border-radius:12px; pointer-events:none; opacity:.85; }
  .group-label { position:absolute; top:-9px; left:8px; max-width:calc(100% - 16px); overflow:hidden; text-overflow:ellipsis; padding:0 7px; border-radius:7px; font-size:10px; line-height:15px; color:#111; font-weight:600; white-space:nowrap; }
  .selection-box { position:absolute; border:1px solid var(--accent); background:var(--select-fill); pointer-events:none; }

  .menu { position:fixed; z-index:10; min-width:190px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:4px; box-shadow:var(--shadow); }
  .menu button { display:block; width:100%; min-height:32px; text-align:left; background:none; border:0; padding:6px 10px; border-radius:4px; font-size:13px; cursor:pointer; }
  .menu button:hover, .menu button:focus-visible { background:var(--surface); }
  .menu hr { border:0; border-top:1px solid var(--border); margin:4px 0; }
  .popover { position:absolute; right:20px; top:52px; z-index:10; max-width:min(420px,calc(100vw - 40px)); background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); }
  .popover label { display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  .popover[hidden] { display:none; }

  @media (prefers-reduced-motion: no-preference) {
    .node { transition:border-color .12s ease, opacity .12s ease; }
    .star { transition:color .12s ease; }
  }
</style>
</head>
<body>
<header id="topbar"><h1>Dashtree</h1></header>
<main id="viewport" aria-label="Tab tree">
  <div id="empty" hidden><strong>Nothing recorded yet</strong><span>Browse a few pages and they will appear here as a tree.</span></div>
  <div id="canvas"></div>
</main>
<script type="module" src="page.js"></script>
</body>
</html>
