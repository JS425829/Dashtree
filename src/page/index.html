<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashtree</title>
<style>
  :root { --bg:#16171b; --card:#2a2d35; --line:#5a5f6b; --text:#e6e6e6; --dim:#9aa0ab; --star:#f5c542; --accent:#4da3ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; font:14px/1.3 system-ui,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
  #topbar { display:flex; align-items:center; gap:14px; padding:10px 20px; border-bottom:1px solid #2b2e36; flex:none; }
  #topbar h1 { font-size:16px; margin:0; letter-spacing:.02em; }
  #topbar .spacer { flex:1; }
  #topbar input[type=search] { width:260px; background:#22242a; color:var(--text); border:1px solid #3a3d46; border-radius:6px; padding:6px 10px; font-size:13px; }
  #topbar button { background:#22242a; color:var(--text); border:1px solid #3a3d46; border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer; }
  #topbar button:hover { border-color:#8aa; }
  #viewport { flex:1; overflow:auto; padding:32px 40px 60px; position:relative; cursor:grab; user-select:none; }
  #viewport.panning { cursor:grabbing; }
  #canvas { position:relative; min-width:100%; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); pointer-events:none; }
  #empty[hidden] { display:none; }

  .connectors { position:absolute; left:0; top:0; pointer-events:none; }
  .connectors path { fill:none; stroke:var(--line); stroke-width:1; }
  .node { position:absolute; display:flex; align-items:center; gap:8px; padding:0 10px; border-radius:8px; cursor:pointer; background:var(--card); border:1px solid var(--line); overflow:hidden; white-space:nowrap; }
  .node.hollow { background:transparent; border:1.5px dashed var(--line); color:var(--dim); }
  .node:hover { border-color:#9bb; }
  .node.selected { outline:2px solid var(--accent); outline-offset:1px; }
  .node.match { border-color:var(--accent); }
  .node.dim { opacity:.3; }
  .node .label { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .node .ico { width:16px; height:16px; flex:none; }
  .node .ico-fallback { width:16px; height:16px; flex:none; border-radius:4px; background:#444851; color:var(--text); font-size:10px; display:flex; align-items:center; justify-content:center; }
  .node .note-mark { color:var(--dim); font-size:12px; }
  .node .star { color:var(--line); font-size:15px; }
  .node.favourite .star { color:var(--star); }
  .group-box { position:absolute; border:2px solid; border-radius:12px; pointer-events:none; opacity:.8; }
  .group-label { position:absolute; top:-11px; left:10px; padding:1px 8px; border-radius:8px; font-size:11px; color:#111; font-weight:600; }
  .selection-box { position:absolute; border:1px solid var(--accent); background:rgba(77,163,255,.15); pointer-events:none; }
  .menu { position:fixed; z-index:10; min-width:180px; background:#22242a; border:1px solid #3a3d46; border-radius:8px; padding:4px; box-shadow:0 6px 20px rgba(0,0,0,.5); }
  .menu button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); padding:6px 10px; border-radius:4px; font-size:13px; cursor:pointer; }
  .menu button:hover { background:#31343c; }
  .menu hr { border:0; border-top:1px solid #3a3d46; margin:4px 0; }
  .popover { position:absolute; right:20px; top:48px; z-index:10; background:#22242a; border:1px solid #3a3d46; border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .popover[hidden] { display:none; }
</style>
</head>
<body>
<header id="topbar"><h1>Dashtree</h1></header>
<main id="viewport">
  <div id="empty" hidden>Nothing recorded yet. Browse a few pages and they will appear here.</div>
  <div id="canvas"></div>
</main>
<script type="module" src="page.js"></script>
</body>
</html>
